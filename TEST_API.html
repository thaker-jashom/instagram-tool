<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester - Food Influencer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #f59e0b;
        }
        .test-section {
            background: #1e293b;
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-section h2 {
            color: #f59e0b;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        button {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }
        .result {
            background: #0f172a;
            border: 1px solid rgba(245, 158, 11, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            color: #10b981;
        }
        .error {
            color: #ef4444;
        }
        .info {
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 8px;
            color: #f8fafc;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 10px;
        }
        .status.online {
            background: #10b981;
            color: white;
        }
        .status.offline {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍔 Food Influencer API Tester</h1>
        
        <div class="test-section">
            <h2>1. Backend Health Check <span id="health-status" class="status">Testing...</span></h2>
            <button onclick="testHealth()">Test Health Endpoint</button>
            <button onclick="testRoot()">Test Root Endpoint</button>
            <div id="health-result" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h2>2. Register New User</h2>
            <label>Email:</label>
            <input type="email" id="reg-email" value="test@example.com" placeholder="Enter email">
            <label>Password:</label>
            <input type="password" id="reg-password" value="Test@123" placeholder="Enter password">
            <label>First Name:</label>
            <input type="text" id="reg-firstname" value="Test" placeholder="Enter first name">
            <label>Last Name:</label>
            <input type="text" id="reg-lastname" value="User" placeholder="Enter last name">
            <button onclick="testRegister()">Test Register</button>
            <div id="register-result" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h2>3. Login User</h2>
            <label>Email:</label>
            <input type="email" id="login-email" value="test@foodai.com" placeholder="Enter email">
            <label>Password:</label>
            <input type="password" id="login-password" value="Test@123" placeholder="Enter password">
            <button onclick="testLogin()">Test Login</button>
            <div id="login-result" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h2>4. Get Current User (Requires Login)</h2>
            <button onclick="testGetMe()">Test Get Me</button>
            <div id="getme-result" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h2>5. Environment Check</h2>
            <button onclick="checkEnvironment()">Check Environment Variables</button>
            <div id="env-result" class="result" style="display:none;"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://instagram-tool-1.onrender.com/api/v1';
        let authToken = null;

        // Auto-test health on load
        window.onload = () => {
            testHealth();
        };

        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = `result ${type}`;
            element.textContent = message;
        }

        async function testHealth() {
            try {
                showResult('health-result', 'Testing...', 'info');
                const response = await fetch('https://instagram-tool-1.onrender.com/health');
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('health-status').className = 'status online';
                    document.getElementById('health-status').textContent = 'Online';
                    showResult('health-result', 
                        `✅ SUCCESS!\n\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 
                        'success'
                    );
                } else {
                    document.getElementById('health-status').className = 'status offline';
                    document.getElementById('health-status').textContent = 'Offline';
                    showResult('health-result', 
                        `❌ FAILED!\n\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 
                        'error'
                    );
                }
            } catch (error) {
                document.getElementById('health-status').className = 'status offline';
                document.getElementById('health-status').textContent = 'Offline';
                showResult('health-result', 
                    `❌ ERROR!\n\n${error.message}\n\nThe backend might be sleeping (Render free tier). Wait 30-60 seconds and try again.`, 
                    'error'
                );
            }
        }

        async function testRoot() {
            try {
                showResult('health-result', 'Testing...', 'info');
                const response = await fetch('https://instagram-tool-1.onrender.com/');
                const data = await response.json();
                
                showResult('health-result', 
                    `✅ SUCCESS!\n\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 
                    'success'
                );
            } catch (error) {
                showResult('health-result', 
                    `❌ ERROR!\n\n${error.message}`, 
                    'error'
                );
            }
        }

        async function testRegister() {
            try {
                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-password').value;
                const firstName = document.getElementById('reg-firstname').value;
                const lastName = document.getElementById('reg-lastname').value;

                showResult('register-result', 'Testing...', 'info');

                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password, firstName, lastName })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('register-result', 
                        `✅ SUCCESS!\n\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}\n\nUser registered successfully!`, 
                        'success'
                    );
                } else {
                    showResult('register-result', 
                        `⚠️ FAILED!\n\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}\n\nNote: User might already exist.`, 
                        'error'
                    );
                }
            } catch (error) {
                showResult('register-result', 
                    `❌ ERROR!\n\n${error.message}\n\nCheck CORS settings and network connection.`, 
                    'error'
                );
            }
        }

        async function testLogin() {
            try {
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                showResult('login-result', 'Testing...', 'info');

                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.token;
                    showResult('login-result', 
                        `✅ SUCCESS!\n\nStatus: ${response.status}\nToken: ${data.token.substring(0, 20)}...\n\nLogin successful! Token saved for testing.`, 
                        'success'
                    );
                } else {
                    showResult('login-result', 
                        `❌ FAILED!\n\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 
                        'error'
                    );
                }
            } catch (error) {
                showResult('login-result', 
                    `❌ ERROR!\n\n${error.message}`, 
                    'error'
                );
            }
        }

        async function testGetMe() {
            try {
                if (!authToken) {
                    showResult('getme-result', 
                        `⚠️ WARNING!\n\nNo auth token found. Please login first.`, 
                        'error'
                    );
                    return;
                }

                showResult('getme-result', 'Testing...', 'info');

                const response = await fetch(`${API_BASE_URL}/auth/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json',
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('getme-result', 
                        `✅ SUCCESS!\n\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 
                        'success'
                    );
                } else {
                    showResult('getme-result', 
                        `❌ FAILED!\n\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 
                        'error'
                    );
                }
            } catch (error) {
                showResult('getme-result', 
                    `❌ ERROR!\n\n${error.message}`, 
                    'error'
                );
            }
        }

        function checkEnvironment() {
            const info = {
                'Current URL': window.location.href,
                'API Base URL': API_BASE_URL,
                'User Agent': navigator.userAgent,
                'Online': navigator.onLine,
                'Auth Token': authToken ? 'Set ✓' : 'Not set ✗'
            };

            showResult('env-result', 
                `Environment Information:\n\n${JSON.stringify(info, null, 2)}`, 
                'info'
            );
        }
    </script>
</body>
</html>
